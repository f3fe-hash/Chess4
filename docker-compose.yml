services:
  chess:
    profiles: ["local-engine"]
    build:
      context: .
    command: ["./Chess"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import socket;
          s = socket.create_connection(("127.0.0.1", 8080), 2);
          s.close()
      interval: 5s
      timeout: 3s
      retries: 12

  lichess:
    build:
      context: .
    command: ["python3", "lichess/lichess.py"]
    network_mode: host
    environment:
      LICHESS_TOKEN: ${LICHESS_TOKEN:?Set LICHESS_TOKEN in .env or the shell}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env or the shell}
      UCI_HOST: 127.0.0.1
      UCI_PORT: ${UCI_PORT:-8080}
    restart: unless-stopped
